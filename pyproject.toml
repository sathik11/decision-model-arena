[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-jev-asset-triage"
version = "0.1.0"
description = "Critical asset incident triage demo combining Microsoft Foundry with typed decision models"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]
foundry = [
  "agent-framework-foundry",
  "agent-framework-foundry-hosting>=1.0.0b260813",
  "azure-ai-projects>=2.0,<3",
  "azure-identity>=1.25,<2",
  "openai<3",
]
laya = [
  "laya>=0.3.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asset_triage = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
